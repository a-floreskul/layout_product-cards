<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="attr-req-value"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div
      class="product-card"
      data-qa="card"
    >
      <a
        href="#"
        class="product-card__link"
        data-qa="hover"
      >
        <div class="product-card__image"></div>
        <div class="product-card__body">
          <h2 class="product-card__title">
            APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
          </h2>

          <p class="product-card__code">Product code: 195434</p>

          <div class="product-card__rating">
            <div class="stars stars--4">
              <div class="stars__star"></div>
              <div class="stars__star"></div>
              <div class="stars__star"></div>
              <div class="stars__star"></div>
              <div class="stars__star"></div>
            </div>
            <p class="product-card__reviews">Reviews: 5</p>
          </div>

          <div class="product-card__price-row">
            <p class="product-card__price-label">Price:</p>
            <p class="product-card__price-value">$2,199</p>
          </div>

          <button class="product-card__button">Buy</button>
        </div>
      </a>
    </div>
  </body>
</html>
